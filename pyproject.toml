[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "qql-tools"
version = "0.1.0"
description = "Tools and converters for QQL and other language course formats"
readme = "README.md"
requires-python = ">=3.11"
license = "MPL-2.0"
authors = [{ name = "QQL-Tools Contributors" }]
keywords = ["qql", "language-learning", "course-format", "converter", "validator"]
classifiers = [
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "License :: OSI Approved :: Mozilla Public License 2.0 (MPL 2.0)",
  "Operating System :: OS Independent",
  "Intended Audience :: Developers",
]

[project.scripts]
qql-tools = "qql_tools.cli:main"

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
